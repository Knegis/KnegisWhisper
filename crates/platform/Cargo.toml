[package]
name = "kw-platform"
description = "Operating-system integration: hotkeys, clipboard, text insertion, window affinity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
# Enumerating processes, to notice a meeting application. The same crate
# `kw_sidecar::reap` uses to verify a command line before signalling it.
sysinfo.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
arboard.workspace = true

kw-overlay.workspace = true

# Every module this crate names is listed. Cargo unifies features across a
# build, so relying on another crate happening to enable one would be a
# dependency on nothing declared anywhere -- the reasoning `crates/security`
# already writes out at length.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    # MonitorFromWindow and GetMonitorInfoW. rcWork is the usable desktop area
    # after taskbars and docked app bars, unlike the full monitor rectangle.
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # IMMDeviceEnumerator, IAudioSessionManager2, IAudioSessionControl2 and the
    # eCapture / AudioSessionState* constants, for `microphone`.
    "Win32_Media_Audio",
    # CoInitializeEx, CoCreateInstance, CLSCTX_ALL. The first COM in this
    # workspace: `kw-audio-core` reaches WASAPI through `cpal` instead.
    "Win32_System_Com",
]

# The `CGEventTap` half of `keyhook`, and nothing else. Both crates are already
# in `Cargo.lock` -- Tauri's own macOS dependencies pull them -- so this adds a
# feature selection rather than a new supply-chain surface.
#
# `default-features = false` with the modules named explicitly, for the reason
# the `windows` block above gives: relying on another crate happening to enable
# a feature is a dependency on nothing declared anywhere. The default set is
# most of CoreGraphics and most of CoreFoundation, neither of which this crate
# reads.
[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
workspace = true
default-features = false
features = [
    "std",
    # CGEventTapCreate, CGEventTapEnable, CGEventGetFlags,
    # CGEventGetIntegerValueField, and CGPreflightListenEventAccess -- which is
    # how the Accessibility permission is *reported* rather than assumed. Pulls
    # objc2-core-foundation/CFMachPort, the type the tap comes back as.
    "CGEvent",
    # CGEventType, CGEventField, CGEventTapLocation / Placement / Options, and
    # CGEventMask.
    "CGEventTypes",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
workspace = true
default-features = false
features = [
    "std",
    # CFRunLoop, CFRunLoopSource and kCFRunLoopCommonModes. A tap delivers
    # through a run loop the way a Win32 hook delivers through a message queue,
    # so this is the direct counterpart of the message loop in windows_impl.
    "CFRunLoop",
    # CFMachPortCreateRunLoopSource: the tap is a mach port and has to be turned
    # into a run-loop source before anything is delivered.
    "CFMachPort",
]

# The XDG global-shortcuts portal client in `portal_shortcuts`. Already in
# `Cargo.lock` -- Tauri's Linux dependencies pull it -- so this is a feature
# selection rather than a new crate, the same argument the macOS block makes.
#
# `tokio` rather than zbus's default `async-io`: this crate already depends on
# tokio, and two executors in one process is a way to deadlock that nothing in
# here would be able to diagnose.
[target.'cfg(target_os = "linux")'.dependencies.zbus]
workspace = true
default-features = false
features = ["tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# `mic_users_probe` only, and only so it can open the microphone itself and
# prove the session enumeration sees something. A probe that has never found
# anything is not evidence of absence -- see the example's own doc comment.
# No cycle: `kw-audio-core` does not depend on this crate.
kw-audio-core.workspace = true

# `capture_probe` alone exercises recorder-facing capture stacks. Keeping these
# features dev-only prevents a hardware validation instrument from expanding
# the APIs linked by the shipping platform crate.
[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
]
