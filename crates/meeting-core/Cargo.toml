[package]
name = "kw-meeting-core"
description = "Meeting transcription provider contract and capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
ts-rs.workspace = true
# For query-string construction in `assemblyai.rs` -- keyterms and other
# session settings travel there rather than in a message sent after the
# handshake, and this is what percent-encodes them correctly.
url.workspace = true

futures.workspace = true

kw-audio-core.workspace = true
kw-network-policy.workspace = true
# For `extract_with_limit`, `integrity::verify` and `Sha256Digest` in
# `diarization_models` -- the same download-and-check machinery every other
# model install in this workspace goes through, rather than a second copy.
kw-sidecar.workspace = true
kw-security.workspace = true
# For the `LocalTranscriber` trait only. The concrete `WhisperServer` is supplied
# by the caller, which is what makes the whole window-to-transcript path testable
# with no server running.
kw-transcription-core.workspace = true

# Was a dev-dependency until 2026-09-01, for one test checking every cloud
# client's credential slot against config/provider-registry.json. It is a real
# one now: `diarization_models` installs the two models the registry describes,
# so the registry types cross into this crate's public API rather than only
# into its tests.
kw-provider-registry.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
