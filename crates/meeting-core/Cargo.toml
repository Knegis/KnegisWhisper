[package]
name = "kw-meeting-core"
description = "Meeting transcription provider contract and capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
ts-rs.workspace = true

kw-audio-core.workspace = true
kw-security.workspace = true
# For the `LocalTranscriber` trait only. The concrete `WhisperServer` is supplied
# by the caller, which is what makes the whole window-to-transcript path testable
# with no server running.
kw-transcription-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
