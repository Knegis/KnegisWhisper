[package]
name = "kw-transcription-core"
description = "Batch speech-to-text route resolution and execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tempfile.workspace = true
kw-transcript-text.workspace = true
ts-rs.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
reqwest.workspace = true
# `sherpa-onnx-offline` is a one-shot CLI rather than a server: each
# transcription spawns a fresh child and writes its input to a temp file,
# which needs tokio's process and fs features outside of tests.
tokio = { workspace = true, features = ["process", "fs", "io-util"] }

kw-network-policy.workspace = true
kw-provider-registry.workspace = true
kw-security.workspace = true
kw-sidecar.workspace = true
# `speech`: the VAD settings and their clamping, and the WAV container the
# chunks are sent in. No cycle: it does not depend on this crate.
kw-audio-core.workspace = true

[dev-dependencies]
# For `tests/subtitle_export.rs` only, which proves a real recording's
# timings survive all the way out to a subtitle file. Dev-only and no cycle:
# it does not depend on this crate.
kw-notes-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "process"] }
