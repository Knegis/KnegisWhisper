[package]
name = "kw-sidecar"
description = "Declarative sidecar binaries: digest-pinned install, loopback port allocation, and PID-verified reaping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
sha2.workspace = true
sysinfo.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
lzma-rs.workspace = true
bzip2-rs.workspace = true
kw-network-policy.workspace = true
# The one mechanism that narrows a file's permissions, shared with
# `kw-local-api`'s discovery file. See `pid.rs`'s `restrict`.
kw-security.workspace = true
async-trait.workspace = true
reqwest.workspace = true

# The kill-on-close Job Object the servers this crate starts are put in
# (`job.rs`, KNEG-569). Listed in full, as `kw-security` and `kw-platform` do:
# features unify across the build, so relying on another crate happening to
# enable one would be a dependency on nothing declared anywhere.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    # HANDLE, CloseHandle
    "Win32_Foundation",
    # SECURITY_ATTRIBUTES, which gates CreateJobObjectW's signature
    "Win32_Security",
    # CreateJobObjectW, SetInformationJobObject, AssignProcessToJobObject
    "Win32_System_JobObjects",
]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs"] }
