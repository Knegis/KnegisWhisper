name: Release

# Build an exact tag into a draft. Publication is a separate reviewed action.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing main-branch tag, e.g. v0.1.0"
        required: true
        type: string
      validate_other_platforms:
        description: "Also build experimental macOS/Linux bundles as workflow artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows x64 preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate tag and existing release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
              throw new Error('Expected a version tag such as v0.1.0');
            }
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (!data.draft) throw new Error('Refusing to replace a published release');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Check out exact tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git checkout --detach "refs/tags/$env:RELEASE_TAG"
      - name: Preflight and release-tool tests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m unittest discover -s tools/release -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release/release.py preflight --tag $env:RELEASE_TAG
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x64
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Repository contracts and frontend tests
        run: |
          node tools/release/contracts.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/desktop run build
      - name: Windows Rust checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
          cargo test --workspace --profile ci --locked
          cargo clippy -p knegiswhisper --lib --tests --features tauri-test --profile ci --locked -- -D warnings
          cargo test -p knegiswhisper --lib --features tauri-test --profile ci --locked
          cargo test -p knegiswhisper --bin knegiswhisper-uninstall --features tauri-test,windows-uninstall --profile ci --locked
          cargo clippy -p knegiswhisper --bin knegiswhisper-uninstall --tests --features tauri-test,windows-uninstall --profile ci --locked -- -D warnings
          python tools/uninstall/generate.py --check
      - name: Install pinned notice generator
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Verify bundled notices
        run: python tools/licenses/generate.py --check
      - name: Build unsigned installer
        working-directory: apps/desktop
        shell: bash
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis --config ../../tools/release/unsigned.json
      - name: Verify built uninstall entry point
        run: python tools/uninstall/verify_build.py target/x86_64-pc-windows-msvc/release
      - name: Native uninstall entry-point recovery
        run: python tools/uninstall/test_windows.py -v
      - name: Prepare installer, checksums and notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/release/release.py prepare --tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: target/release-assets/*
          if-no-files-found: error

  draft:
    name: Prepare draft prerelease
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          path: release-assets
      - name: Verify downloaded installer checksum
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Refuse published release replacement
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
              if (!data.draft) throw new Error('Release was published while building; refusing replacement');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: KnegisWhisper ${{ inputs.tag }} - Windows preview
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt

  experimental:
    name: Experimental bundles (${{ matrix.os }})
    if: inputs.validate_other_platforms
    needs: windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned notice generator
        run: cargo install cargo-about --version 0.8.4 --locked
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libglib2.0-dev libgtk-3-dev libasound2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - name: Generate target notices
        shell: bash
        run: |
          npm --prefix apps/desktop run build
          cargo fetch --locked
          target=$(rustc -vV | sed -n 's/^host: //p')
          python tools/licenses/generate.py --target "$target"
      - name: Build experimental unsigned bundles
        working-directory: apps/desktop
        run: npm run tauri:build -- --config ../../tools/release/unsigned.json
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
          if-no-files-found: error
