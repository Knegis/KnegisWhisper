[workspace]
resolver = "2"
exclude = ["vendor/cpal"]
members = [
    "apps/desktop/src-tauri",
    "crates/app-core",
    "crates/audio-core",
    "crates/calendar-core",
    "crates/local-api",
    "crates/meeting-core",
    "crates/network-policy",
    "crates/notes-core",
    "crates/overlay",
    "crates/platform",
    "crates/provider-probe",
    "crates/provider-registry",
    "crates/reasoning-core",
    "crates/security",
    "crates/sidecar",
    "crates/transcription-core",
    "tools/knegiswhisper",
    "tools/knegiswhisper-mcp",
    "crates/storage",
]

# Crates are added by the commit that gives them real content, not up front.
# The brief asks for vertical slices over broad unfinished scaffolding, so an
# empty crate is not created just to reserve its name.
#
# See docs/ARCHITECTURE.md for the full intended layout.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["Axel Karlsson"]
repository = "https://github.com/axelalbertkarlsson/KnegisWhisper"

# Package names carry a `kw-` prefix so cargo output is unambiguous, while
# directory names stay as documented in docs/ARCHITECTURE.md.
[workspace.dependencies]
kw-app-core = { path = "crates/app-core" }
kw-audio-core = { path = "crates/audio-core" }
kw-calendar-core = { path = "crates/calendar-core" }
kw-local-api = { path = "crates/local-api" }
kw-meeting-core = { path = "crates/meeting-core" }
kw-network-policy = { path = "crates/network-policy" }
kw-notes-core = { path = "crates/notes-core" }
kw-overlay = { path = "crates/overlay" }
kw-platform = { path = "crates/platform" }
kw-provider-probe = { path = "crates/provider-probe" }
kw-provider-registry = { path = "crates/provider-registry" }
kw-reasoning-core = { path = "crates/reasoning-core" }
kw-security = { path = "crates/security" }
kw-sidecar = { path = "crates/sidecar" }
kw-storage = { path = "crates/storage" }
kw-transcription-core = { path = "crates/transcription-core" }
kw-cli = { path = "tools/knegiswhisper" }
kw-mcp = { path = "tools/knegiswhisper-mcp" }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "net"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript declarations for everything that crosses the IPC boundary.
# Not optional, and not behind a feature: a type that crosses the boundary
# without a `TS` derive is one the generator cannot see, and an optional
# dependency would make that a silent omission rather than a compile error.
# Nothing calls into it at runtime; release builds strip the impls.
ts-rs = "12"

# Errors and logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json",
] }

# Credentials
subtle = "2"
getrandom = "0.2"
# Enterprise request signing. AWS SigV4 is HMAC-SHA256 over a canonical request;
# Google's service-account flow is an RS256-signed JWT exchanged for an access
# token. Both are pure-Rust here rather than through a vendor SDK: the AWS and
# GCP SDKs pull in their own HTTP clients and credential-discovery chains, and a
# credential chain that reads the environment and ~/.aws is exactly the implicit
# behaviour the network boundary exists to rule out.
hmac = "0.12"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
keyring = { version = "3", features = [
    "apple-native", "windows-native", "sync-secret-service", "crypto-rust",
] }

# HTTP — only crates/network-policy may depend on this. Enforced by review and
# by the fact that nothing else declares it.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
# Meeting audio streams over a WebSocket. `rustls-tls-webpki-roots` rather than
# native roots, because that is what reqwest's `rustls-tls` already pulls in:
# one rustls and one trust store in the binary rather than two, so a certificate
# accepted by one half of the application is accepted by the other.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url = "2"

# Audio
cpal = "0.15"
hound = "3"
ringbuf = "0.4"

# Platform
arboard = { version = "3", default-features = false }
windows = "0.58"

# Sidecars
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Pure-Rust decompression on purpose: cmake, ninja, and clang are not installed
# on the development machine, so a dependency that shells out to a C toolchain
# would make the workspace unbuildable here.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# ffmpeg ships `.tar.xz` on Linux. Same reasoning as `flate2` above -- pure
# Rust, decode-only is all extraction needs.
lzma-rs = "0.3"
# sherpa-onnx ships `.tar.bz2` almost exclusively. Same reasoning again --
# decode-only, pure Rust.
bzip2-rs = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
# Comparing a published release tag against this build's version, for the
# updater. No I/O and no other dependency of its own.
semver = "1"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Used from Rust only, never from the renderer. The save dialog is opened by the
# command that writes the file, so the chosen path never crosses the IPC boundary
# and the frontend needs no dialog permission -- see docs/SECURITY.md on path
# traversal through export.
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Fail the build on anything that panics in library code. This app runs
# unattended in the background; an unwrap on a missing window handle or a
# poisoned mutex is a crash the user cannot diagnose. Pluely's
# `get_webview_panel("main").unwrap()` is the pattern being ruled out here.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# Sidecar-heavy debugging is unbearable without optimized dependencies, but
# keep our own crates unoptimized so breakpoints stay useful.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Hosted checks need diagnostics and debug assertions, not optimized audio
# dependencies. A cold Windows run spent 51 minutes compiling before tests.
[profile.ci]
inherits = "dev"
debug = 1

[profile.ci.package."*"]
opt-level = 0

[patch.crates-io]
cpal = { path = "vendor/cpal" }
