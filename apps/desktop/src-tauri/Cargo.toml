[package]
name = "knegiswhisper"
description = "KnegisWhisper desktop application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Enables Tauri's mock runtime and the Windows manifest needed by its test
# executable. Never enabled by the application build.
#
# A feature, and deliberately not a dev-dependency. That was tried and
# measured, because it looks strictly better -- `cargo test` and
# `cargo clippy --all-targets` would pick the tests up with no flag to
# forget. It does not work. build.rs has to know whether it is building the
# test executable, since the Common Controls v6 manifest that executable
# needs must not reach the shipped binary, and the only link-arg key that
# expresses per-target scope is refused here:
#
#   error: invalid instruction `cargo:rustc-link-arg-tests`
#   The package knegiswhisper does not have a test target.
#
# It applies to `tests/` targets and this test is a `--lib` unit test.
# Moving it to `tests/` would mean making `commands`, `state` and `media`
# public modules -- every module in lib.rs is private by design -- plus
# widening `MAX_DIALOG_GRANTS` and `DialogGrants::grant`, and rebuilding a
# `runtime()` helper that only exists under cfg(test). Opening the crate up
# to place one test is a worse trade than keeping the flag.
#
# The cost of a feature is that an invocation can forget it, and for a while
# every invocation did (KNEG-147). `tools/feature-audit/scan.mjs` is the
# answer to that: it fails when a declared feature is named by no CI step.
tauri-test = ["tauri/test"]

[lib]
# Tauri convention: the binary is a thin wrapper so the app can also be driven
# from integration tests and, later, from the mobile targets.
name = "knegiswhisper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Named `-desktop` because `tools/knegiswhisper` produces the CLI, and two
# workspace binaries sharing one name silently overwrite each other in
# target/debug. That is not a tidiness point: it happened. The CLI's end-to-end
# tests resolve `CARGO_BIN_EXE_knegiswhisper`, and once the desktop app had been
# linked more recently they launched the GUI application fifteen times with
# command-line arguments it ignored — leaving a stray window on screen and a
# locked executable that broke the next build.
#
# The installed product is still called KnegisWhisper: `productName` in
# tauri.conf.json decides that, and `mainBinaryName` points the bundler here.
# Only the development artifact moves.
[[bin]]
name = "knegiswhisper-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tempfile.workspace = true
# `macos-private-api` is what makes `WebviewWindowBuilder::transparent` exist on
# macOS at all -- it is `#[cfg(any(not(target_os = "macos"), feature =
# "macos-private-api"))]` in tauri 2.11.5. Without it the three transparent
# panels are a compile error there ("E0599: no method named transparent") and
# nothing whatsoever on Windows, which is how KNEG-221 reached dev.
#
# Declared here rather than left to the Tauri CLI. The CLI derives this feature
# from `app.macOSPrivateApi` in tauri.conf.json, but CI runs `cargo clippy`,
# `cargo test` and `cargo build` directly and never goes through the CLI, so the
# derived feature never arrives. Both are set and
# `tools/capability-audit/scan.mjs` rule F fails when they disagree.
#
# This comment is the only prose either half carries: `tauri.conf.json`'s `app`
# object is deny-unknown-fields, so the `$comment` key that documents
# `plugins.updater.pubkey` is refused there -- `unknown field '$comment'`, and
# the build script fails, which is how that was found rather than guessed.
# See docs/PLATFORM_SUPPORT.md § Privacy overlay for the App Store trade.
tauri = { workspace = true, features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
async-trait.workspace = true
# Both for `sherpa_stream`'s readiness probe: the streaming server has no health
# endpoint, so readiness is a real WebSocket handshake rather than an HTTP GET
# that would be a 400 forever. Same versions the meeting clients already use.
tokio-tungstenite.workspace = true
futures.workspace = true
url.workspace = true
chrono.workspace = true
semver.workspace = true
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
hound.workspace = true

kw-app-core.workspace = true
kw-audio-core.workspace = true
kw-calendar-core.workspace = true
kw-local-api.workspace = true
kw-network-policy.workspace = true
kw-meeting-core.workspace = true
kw-notes-core.workspace = true
kw-reasoning-core.workspace = true
kw-sidecar.workspace = true
kw-transcription-core.workspace = true
kw-overlay.workspace = true
kw-platform.workspace = true
kw-provider-probe.workspace = true
kw-provider-registry.workspace = true
kw-security.workspace = true
kw-storage.workspace = true

[dev-dependencies]
sqlx.workspace = true
# Only for the `#[ignore]`d HEAD-request test that re-measures the local-LLM
# sizes against Hugging Face. The application itself never names `reqwest` --
# `kw-network-policy` is the one crate that does -- but that crate hands back a
# `reqwest::RequestBuilder`, and building a HEAD request means naming the method.
reqwest.workspace = true
