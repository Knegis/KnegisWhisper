[package]
name = "knegiswhisper"
description = "KnegisWhisper desktop application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Tauri convention: the binary is a thin wrapper so the app can also be driven
# from integration tests and, later, from the mobile targets.
name = "knegiswhisper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Named `-desktop` because `tools/knegiswhisper` produces the CLI, and two
# workspace binaries sharing one name silently overwrite each other in
# target/debug. That is not a tidiness point: it happened. The CLI's end-to-end
# tests resolve `CARGO_BIN_EXE_knegiswhisper`, and once the desktop app had been
# linked more recently they launched the GUI application fifteen times with
# command-line arguments it ignored — leaving a stray window on screen and a
# locked executable that broke the next build.
#
# The installed product is still called KnegisWhisper: `productName` in
# tauri.conf.json decides that, and `mainBinaryName` points the bundler here.
# Only the development artifact moves.
[[bin]]
name = "knegiswhisper-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
async-trait.workspace = true
url.workspace = true
chrono.workspace = true
semver.workspace = true
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

kw-app-core.workspace = true
kw-audio-core.workspace = true
kw-local-api.workspace = true
kw-network-policy.workspace = true
kw-meeting-core.workspace = true
kw-notes-core.workspace = true
kw-reasoning-core.workspace = true
kw-sidecar.workspace = true
kw-transcription-core.workspace = true
kw-overlay.workspace = true
kw-platform.workspace = true
kw-provider-probe.workspace = true
kw-provider-registry.workspace = true
kw-security.workspace = true
kw-storage.workspace = true

[dev-dependencies]
tempfile.workspace = true
